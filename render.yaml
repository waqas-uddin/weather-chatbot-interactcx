services:
  - type: web
    name: weather-chatbot-interactcx
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
